<link rel="stylesheet" href="/shared/ui.css">
<style>
  [hidden] { display: none !important; } /* #gate/#hud set display below, which would otherwise beat the hidden attribute */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* width/height are required: a canvas is a replaced element, so inset alone does not stretch it, and with
     setPixelRatio(2) it would show at twice the screen size, cropped to the top-left quarter. */
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* viewfinder corners */
  .frame { position: fixed; inset: max(64px, calc(env(safe-area-inset-top) + 52px)) 18px max(210px, calc(env(safe-area-inset-bottom) + 196px)); pointer-events: none; }
  .frame i { position: absolute; width: 22px; height: 22px; border: 2px solid rgba(244,237,228,.55); }
  .frame i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 6px; }
  .frame i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 6px; }
  .frame i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 6px; }
  .frame i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 6px; }
  body.recording .frame i { border-color: rgba(255,77,77,.85); }
  #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom)); }
  #hud > * { pointer-events: auto; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .top .right { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 74vw; }
  .glass { background: rgba(14,14,17,.55); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: var(--fg); }
  #status { font-variant-numeric: tabular-nums; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  #status.rec { color: #ffd0d0; border-color: rgba(255,77,77,.5); background: rgba(70,10,10,.6); font-family: var(--mono); }
  .tbtn { height: 34px; padding: 0 12px; border-radius: 999px; font: 600 13px var(--font); display: inline-flex; align-items: center; gap: 6px; }
  .tbtn:active { transform: scale(.96); }
  .tbtn.on { background: rgba(224,122,82,.55); border-color: rgba(240,160,125,.8); }
  #room { font: 600 11px var(--mono); letter-spacing: .12em; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .zoom { align-self: center; display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 999px; margin-top: auto; margin-bottom: 12px; width: min(78vw, 360px); }
  .zoom input { flex: 1; accent-color: var(--accent); height: 28px; }
  .zoom span { font: 600 12px var(--mono); min-width: 52px; text-align: right; }
  #rec { width: 82px; height: 82px; border-radius: 50%; border: 0; padding: 0; flex: none; background: transparent; position: relative; box-shadow: 0 0 0 4px rgba(255,255,255,.92), 0 10px 30px -8px rgba(0,0,0,.6); }
  #rec::after { content: ''; position: absolute; inset: 8px; border-radius: 50%; background: var(--rec); transition: all .25s var(--ease); }
  #rec.on::after { inset: 24px; border-radius: 8px; }
  #rec:active::after { transform: scale(.94); }
  .stickwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; font: 600 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: rgba(244,237,228,.7); }
  .stick { position: relative; width: 124px; height: 124px; border-radius: 50%; background: rgba(14,14,17,.42); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); touch-action: none; }
  .stick.vertical { width: 64px; height: 124px; border-radius: 32px; }
  .knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #d8d2c9); box-shadow: 0 6px 16px rgba(0,0,0,.45); pointer-events: none; }
  #gate { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 28px; background: radial-gradient(500px 360px at 50% 115%, rgba(224,122,82,.35), transparent), linear-gradient(180deg, #17130f, #0b0b0d 60%); }
  #gate .wrap { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #gate img { width: 170px; height: 170px; object-fit: contain; filter: drop-shadow(0 22px 28px rgba(0,0,0,.55)); animation: bob 6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg) } 50% { transform: translateY(-10px) rotate(3deg) } }
  #gate h1 { margin: 0; font: 800 30px/1.05 var(--display); letter-spacing: -.02em; }
  #gate p { margin: 0; color: var(--fg-2); }
  #gate ol { margin: 4px 0 6px; padding: 0; list-style: none; display: grid; gap: 8px; text-align: left; width: 100%; }
  #gate li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--fg-2); font-size: 14px; }
  #gate li span { font: 600 12px var(--mono); color: var(--accent-2); }
  #gate .btn { width: 100%; }
  #err { color: #ff9b9b; font-size: 13px; min-height: 1em; }
  .hint { position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); padding: 18px; border-radius: 18px; display: flex; flex-direction: column; gap: 10px; animation: rise .4s var(--ease) both; }
  .hint > b { font: 700 18px var(--display); }
  .hint p { margin: 0; color: var(--fg-2); font-size: 14px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",

<body>
<canvas id="view"></canvas>
<div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div id="hud" hidden>
  <div class="top">
    <span class="pill glass" id="status">connecting…</span>
    <div class="right">
      <button class="tbtn glass" id="rehearse" hidden title="Play the set's movement once, without recording">Rehearse</button>
      <button class="tbtn glass" id="ride" hidden title="Ride along with something that moves">On foot</button>
      <button class="tbtn glass" id="frameBtn" title="The shape of the final video">16:9</button>
      <button class="tbtn glass" id="rigBtn" title="Handheld, gimbal (horizon level), tripod (stays put) or dolly (moves on one line)">Handheld</button>
      <button class="tbtn glass" id="ghostBtn" title="Show your last take's path faintly, to beat or match it">Ghost</button>
      <button class="tbtn glass" id="speed" aria-label="Walking speed">1×</button>
      <button class="tbtn glass" id="anchor">Re&#8209;anchor</button>
      <span class="pill glass" id="room"></span>
    </div>
  </div>
  <div class="zoom glass"><input type="range" id="zoom" min="0" max="1000" step="1" aria-label="Zoom (lens)"><span id="lensLabel">24 mm</span></div>
  <div class="bottom">
    <div class="stickwrap"><div class="stick" id="walk"></div>Walk</div>
    <button id="rec" aria-label="Record"></button>
    <div class="stickwrap"><div class="stick vertical" id="lift"></div>Up · down</div>
  </div>
</div>

<div id="gate">
  <div class="wrap">
    <img src="/assets/obj-phone.webp" alt="">
    <span class="eyebrow">HandCam</span>
    <h1>Your phone is the camera</h1>
    <ol>
      <li><span>01</span>Tap below and allow motion</li>
      <li><span>02</span>Point at the set, tap Re&#8209;anchor</li>
      <li><span>03</span>Tap ● and move like a camera operator</li>
    </ol>
    <button class="btn light lg" id="enable">Enable motion</button>
    <div id="err"></div>
  </div>
</div>

<script type="module">
import * as THREE from './shared/three.js';
import { MSG, connectRelay } from './shared/protocol.js';
import { orientationToQuaternion, requestMotionPermission, screenAngle } from './shared/orientation.js';
import { renderScene, povStage, animateScene, motionLength } from './shared/scene-render.js';
import { frameAt } from './shared/motion.js';
import { FRAMES, DEFAULT_FRAME, LENS_RANGE, DEFAULT_LENS, fovFromLens } from './shared/frames.js';
import { makeStick } from './shared/joystick.js';
import { putTake, allTakes } from './shared/store.js';

const WALK_SPEED = 1.4;          // m/s at 1×, a normal walking pace
const SPEEDS = [1, 3, 10];       // life-size, then faster for big sets
const SAMPLE_MS = 1000 / 60 - 4; // every frame at 60 Hz, every other frame at 120 Hz

const params = new URLSearchParams(location.search);
const room = (params.get('room') || 'DEMO').toUpperCase();
document.getElementById('room').textContent = room;
const statusEl = document.getElementById('status');
const say = (text, rec = false) => { statusEl.textContent = text; statusEl.classList.toggle('rec', rec); };

// --- three.js POV --------------------------------------------------------
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 1);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene3 = povStage();
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 200);
let sceneGroup = null, sceneId = null, setId = null, spawn = { p: [0, 1.6, 6], yaw: 0 };
camera.position.fromArray(spawn.p);
function setScene(scene) {
  if (sceneGroup) scene3.remove(sceneGroup);
  sceneGroup = renderScene(scene);
  scene3.add(sceneGroup);
  sceneId = scene.id || null;
  spawn = { p: scene.spawn?.p || [0, 1.6, 6], yaw: scene.spawn?.yaw || 0 };
  const newSet = (scene.setId || scene.id) !== setId; // an edit on the laptop keeps you where you stand
  setId = scene.setId || scene.id;
  if (newSet) anchor();
  setupMotionButtons();
}

// --- Phase 3b: the set's clock, rehearse, ride along ---------------------------------------
// Everything that moves waits at its start until ● is pressed; the take's ts is the set's clock.
let rehearseStart = null, ride = null; // ride: { id, offset (camera in the vehicle's frame), yaw0 }
const rideBtn = document.getElementById('ride'), rehearseBtn = document.getElementById('rehearse');
function setClock(t) {
  if (recording && recStart !== null) return t - recStart;
  if (rehearseStart !== null) {
    const ms = t - rehearseStart;
    if (ms > motionLength(sceneGroup) * 1000 + 1000) { rehearseStart = null; rehearseBtn.classList.remove('on'); say('Rehearsal done'); return 0; }
    return ms;
  }
  return 0;
}
function movers() { // things with their own moves you can ride with
  const plan = sceneGroup?.userData.motion;
  return plan ? [...plan.own.keys()].map((id) => plan.byId.get(id)) : [];
}
function setupMotionButtons() {
  const list = movers();
  rehearseBtn.hidden = !motionLength(sceneGroup);
  rideBtn.hidden = !list.length;
  if (ride && !list.some((o) => o.id === ride.id)) setRide(null);
}
rehearseBtn.onclick = () => {
  if (recording) return;
  rehearseStart = rehearseStart === null ? performance.now() : null;
  rehearseBtn.classList.toggle('on', rehearseStart !== null);
  say(rehearseStart !== null ? 'Rehearsing (not recording)' : 'Ready');
};
const rideM = new THREE.Matrix4(), rideInv = new THREE.Matrix4(), rideQ = new THREE.Quaternion();
function setRide(id, ms = 0) {
  if (!id) { ride = null; rideBtn.textContent = 'On foot'; return; }
  const f = frameAt(sceneGroup.userData.motion, id, ms);
  rideM.fromArray(f.elements); rideInv.copy(rideM).invert();
  const o0 = sceneGroup.userData.motion.byId.get(id);
  if (camera.position.distanceTo(new THREE.Vector3(...f.p)) > 6) {
    // too far to be "in" it: start just ahead of it, at eye level, looking back at it (the windscreen shot)
    const ahead = (o0.size?.[2] ?? 1) / 2 + 2;
    camera.position.set(0, 1.4 - (o0.p?.[1] ?? 0), ahead).applyMatrix4(rideM);
    faceYaw(Math.atan2(f.p[0] - camera.position.x, f.p[2] - camera.position.z) + Math.PI);
  }
  ride = { id, offset: camera.position.clone().applyMatrix4(rideInv), yaw0: f.yaw };
  const o = sceneGroup.userData.motion.byId.get(id);
  rideBtn.textContent = `Riding: ${o.label || o.id}`;
}
rideBtn.onclick = () => { // On foot → each mover → On foot
  const list = movers(), i = ride ? list.findIndex((o) => o.id === ride.id) : -1;
  setRide(list[i + 1]?.id || null, lastSetMs);
  say(ride ? 'Your hand and the sticks now move you inside it' : 'On foot');
};
let lastSetMs = 0;
// --- Phase 4: the frame you shoot for, and the lens -----------------------------------------
// The phone shows exactly the chosen frame (bars outside it), like a real camera's monitor.
let shotFrame = DEFAULT_FRAME, lens = DEFAULT_LENS;
try { shotFrame = FRAMES[localStorage.getItem('handcam.frame')] ? localStorage.getItem('handcam.frame') : DEFAULT_FRAME; } catch {}
const view = { x: 0, y: 0, w: 1, h: 1 };
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  const a = FRAMES[shotFrame], screenA = innerWidth / innerHeight;
  view.w = screenA > a ? Math.round(innerHeight * a) : innerWidth;
  view.h = screenA > a ? innerHeight : Math.round(innerWidth / a);
  view.x = Math.round((innerWidth - view.w) / 2); view.y = Math.round((innerHeight - view.h) / 2);
  Object.assign(document.querySelector('.frame').style, { left: `${view.x + 10}px`, top: `${view.y + 10}px`, width: `${view.w - 20}px`, height: `${view.h - 20}px`, right: 'auto', bottom: 'auto' });
  camera.aspect = a;
  camera.fov = fovFromLens(lens, a);
  camera.updateProjectionMatrix();
}
const frameBtn = document.getElementById('frameBtn');
frameBtn.textContent = shotFrame;
frameBtn.onclick = () => {
  if (recording) return;
  const keys = Object.keys(FRAMES);
  shotFrame = keys[(keys.indexOf(shotFrame) + 1) % keys.length];
  frameBtn.textContent = shotFrame;
  try { localStorage.setItem('handcam.frame', shotFrame); } catch {}
  resize();
};
// Zoom: a full-frame lens size, recorded on every sample like position and rotation (performed, never added later).
const zoomEl = document.getElementById('zoom'), lensLabel = document.getElementById('lensLabel');
const [LMIN, LMAX] = LENS_RANGE, toLens = (v) => LMIN * Math.pow(LMAX / LMIN, v / 1000), toSlider = (mm) => (1000 * Math.log(mm / LMIN)) / Math.log(LMAX / LMIN);
zoomEl.value = toSlider(lens);
zoomEl.oninput = () => {
  lens = Math.round(toLens(Number(zoomEl.value)) * 10) / 10;
  lensLabel.textContent = `${Math.round(lens)} mm`;
  camera.fov = fovFromLens(lens, FRAMES[shotFrame]);
  camera.updateProjectionMatrix();
};
addEventListener('resize', resize); resize();

// --- orientation + re-anchor ------------------------------------------------
const rawQ = new THREE.Quaternion();
const yawOffset = new THREE.Quaternion(); // turns "where the phone points now" into the set's forward
const Y = new THREE.Vector3(0, 1, 0);
let haveOrientation = false;
function onOrientation(e) {
  if (e.alpha == null) return;
  orientationToQuaternion(rawQ, e.alpha, e.beta, e.gamma, screenAngle());
  if (!haveOrientation) { haveOrientation = true; anchor(); } // first reading: start facing the set
}
/** Turn the view so the phone's current direction looks along `yaw` (0 = looking down -z). */
function faceYaw(yaw) {
  if (!haveOrientation) return;
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(rawQ);
  yawOffset.setFromAxisAngle(Y, yaw - Math.atan2(-fwd.x, -fwd.z));
}
/** Re-anchor: wherever the phone points now becomes the spawn direction, and the camera goes back to spawn. */
function anchor() {
  if (typeof ride !== 'undefined' && ride) setRide(null);
  camera.position.fromArray(spawn.p);
  faceYaw(spawn.yaw);
}
document.getElementById('anchor').onclick = () => { anchor(); relay.send({ t: MSG.ANCHOR }); };

// --- walking ----------------------------------------------------------------
const walk = makeStick(document.getElementById('walk'));
const lift = makeStick(document.getElementById('lift'));
let speedScale = 1;
const speedBtn = document.getElementById('speed');
speedBtn.onclick = () => { speedScale = SPEEDS[(SPEEDS.indexOf(speedScale) + 1) % SPEEDS.length]; speedBtn.textContent = `${speedScale}×`; };
const heading = new THREE.Euler();
function move(dt) {
  if (rig === 'tripod') return; // a tripod stays where it stands: pan, tilt and zoom only
  const { x: wx, y: wy } = walk.value, ly = lift.value.y;
  if (!wx && !wy && !ly) return;
  const yaw = heading.setFromQuaternion(camera.quaternion, 'YXZ').y; // walk where the camera faces, ignoring tilt
  const step = WALK_SPEED * speedScale * dt;
  let dx = (Math.cos(yaw) * wx + Math.sin(yaw) * wy) * step, dz = (-Math.sin(yaw) * wx + Math.cos(yaw) * wy) * step;
  if (rig === 'dolly' && dollyDir) { // on a track: only along the line you faced when ● was pressed, no up/down
    const along = dx * dollyDir.x + dz * dollyDir.z;
    dx = along * dollyDir.x; dz = along * dollyDir.z;
  } else camera.position.y = Math.max(0.1, camera.position.y - ly * step);
  camera.position.x += dx; camera.position.z += dz;
}

// --- Phase 4b: rigs and ghost --------------------------------------------------------------------
// A rig is a limit while shooting, like a real rig, saved with the take. The samples are still exactly what the
// camera did; nothing is smoothed (DECISIONS §18).
const RIGS = ['handheld', 'gimbal', 'tripod', 'dolly'], RIG_NAMES = { handheld: 'Handheld', gimbal: 'Gimbal', tripod: 'Tripod', dolly: 'Dolly' };
let rig = 'handheld', dollyDir = null;
const rigBtn = document.getElementById('rigBtn');
rigBtn.onclick = () => {
  if (recording) return;
  rig = RIGS[(RIGS.indexOf(rig) + 1) % RIGS.length];
  rigBtn.textContent = RIG_NAMES[rig];
  say({ handheld: 'Handheld: everything free', gimbal: 'Gimbal: the horizon stays level', tripod: 'Tripod: pan, tilt and zoom only', dolly: 'Dolly: moves only straight ahead/back once you press ●' }[rig]);
};
const levelM = new THREE.Matrix4(), levelFwd = new THREE.Vector3(), ORIGIN = new THREE.Vector3();
/** Gimbal: same direction, no roll (the horizon stays level). */
function levelRoll(qq) {
  levelFwd.set(0, 0, -1).applyQuaternion(qq);
  if (Math.abs(levelFwd.y) > 0.995) return; // straight up/down: roll is undefined, leave it
  levelM.lookAt(ORIGIN, levelFwd, Y);
  qq.setFromRotationMatrix(levelM);
}
// Ghost: the last take's camera path as a faint line, and its camera as a faint marker at the same moment.
let ghostOn = false, ghostTake = null, ghostLine = null, ghostDot = null;
const ghostBtn = document.getElementById('ghostBtn');
async function loadGhost() {
  if (ghostLine) { scene3.remove(ghostLine, ghostDot); ghostLine = ghostDot = null; }
  if (!ghostOn) return;
  ghostTake = (await allTakes().catch(() => [])).find((t) => t.sceneId && t.samples?.length) || null;
  if (!ghostTake) { say('No earlier take for a ghost yet'); return; }
  const pts = ghostTake.samples.filter((_, i) => i % 3 === 0).map((sm) => new THREE.Vector3(...sm.p));
  if (pts.length < 2) pts.push(pts[0].clone().add(new THREE.Vector3(0, 0.001, 0)));
  // a slim tube (lines are 1 px on phones): display only, the path itself is the raw samples
  ghostLine = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), Math.min(400, pts.length * 2), 0.025, 6), new THREE.MeshBasicMaterial({ color: 0x9fd0ff, transparent: true, opacity: 0.5, depthWrite: false }));
  ghostDot = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.2, 0.14), new THREE.MeshBasicMaterial({ color: 0x9fd0ff, transparent: true, opacity: 0.55, wireframe: true }));
  scene3.add(ghostLine, ghostDot);
}
ghostBtn.onclick = () => { ghostOn = !ghostOn; ghostBtn.classList.toggle('on', ghostOn); loadGhost(); };
function placeGhost(setMs) {
  if (!ghostDot || !ghostTake) return;
  let lo = 0, hi = ghostTake.samples.length - 1, sm = ghostTake.samples;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (sm[mid].ts <= setMs) lo = mid; else hi = mid - 1; }
  ghostDot.position.fromArray(sm[lo].p);
  ghostDot.quaternion.fromArray(sm[lo].q);
}

// --- relay -----------------------------------------------------------------
const relay = connectRelay({
  role: 'cam', room,
  onStatus: s => { if (!recording) say(s === 'connected' ? 'Connected' : s === 'disconnected' ? 'Disconnected' : s); },
  onMessage: (m) => {
    if (m.t === MSG.SCENE) setScene(m.scene);
    if (m.t === MSG.PEER && !recording) say(m.joined ? 'Studio connected' : 'Studio left');
    if (m.t === MSG.REC) setRec(m.state === 'start');
  },
});
// The set comes from the desk: it sends `scene` whenever it builds one and whenever this phone joins.

// --- recording -----------------------------------------------------------------
// Samples are the exact values driving this view: unfiltered rotation, joystick position. Never smoothed.
let recording = false, samples = [], recStart = null, takeCount = 0;
const recBtn = document.getElementById('rec');
function setRec(on) {
  if (on === recording) return;
  recording = on;
  recBtn.classList.toggle('on', on);
  document.body.classList.toggle('recording', on);
  frameBtn.disabled = on; rigBtn.disabled = on;
  if (on && rig === 'dolly') { const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); f.y = 0; dollyDir = f.lengthSq() > 1e-6 ? f.normalize() : null; }
  if (!on) dollyDir = null;
  if (on) { samples = []; recStart = null; rehearseStart = null; rehearseBtn.classList.remove('on'); say('● 0:00', true); }
  else finishTake();
}
recBtn.onclick = () => setRec(!recording);

function takeId() {
  const hex = Math.floor(Math.random() * 0x10000).toString(16).padStart(4, '0');
  return `${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}Z-${hex}`;
}
async function finishTake() {
  if (!samples.length) { say('Nothing recorded'); return; }
  const take = {
    id: takeId(), sceneId, fps_hint: 60, frame: shotFrame, rig,
    view: { fov: fovFromLens(samples[0].f || lens, FRAMES[shotFrame]), aspect: FRAMES[shotFrame] },
    device: { ua: navigator.userAgent, source: 'gyro+joystick' },
    ...(ride && { ride: ride.id }),
    samples,
  };
  samples = [];
  relay.send({ t: MSG.TAKE, take }); // the whole take in one message, after the fact: no live packet loss can touch it
  takeCount++;
  say(`Take ${takeCount} saved · ${(take.samples.at(-1).ts / 1000).toFixed(1)} s`);
  try { await putTake(take); } catch (e) { console.warn('could not keep take on phone', e); }
  if (ghostOn) loadGhost(); // the take you just shot is the next ghost
}
const clock = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}`;

// --- main loop -------------------------------------------------------------
const q = new THREE.Quaternion();
let lastFrame = null, lastSample = -Infinity;
function frame(t) {
  const dt = lastFrame === null ? 0 : Math.min((t - lastFrame) / 1000, 0.1);
  lastFrame = t;
  const setMs = setClock(t);
  lastSetMs = setMs;
  animateScene(sceneGroup, setMs);
  placeGhost(setMs);
  if (haveOrientation) {
    q.copy(yawOffset).multiply(rawQ);
    if (ride) { // inside a moving vehicle: it carries you and turns you with it; your hand and sticks move you within it
      const f = frameAt(sceneGroup.userData.motion, ride.id, setMs);
      rideM.fromArray(f.elements); rideInv.copy(rideM).invert();
      q.premultiply(rideQ.setFromAxisAngle(Y, f.yaw - ride.yaw0));
      camera.position.copy(ride.offset).applyMatrix4(rideM);
    }
    if (rig === 'gimbal') levelRoll(q);
    camera.quaternion.copy(q);
    move(dt);
    if (ride) ride.offset.copy(camera.position).applyMatrix4(rideInv);
  }
  renderer.setScissorTest(false); renderer.clear(); // bars outside the frame
  renderer.setViewport(view.x, view.y, view.w, view.h); renderer.setScissor(view.x, view.y, view.w, view.h); renderer.setScissorTest(true);
  renderer.render(scene3, camera);
  if (haveOrientation && t - lastSample >= SAMPLE_MS) {
    lastSample = t;
    const qa = [q.x, q.y, q.z, q.w], p = camera.position.toArray();
    if (recording) {
      if (recStart === null) recStart = t;
      samples.push({ ts: t - recStart, q: qa, p, f: lens });
      if (samples.length % 30 === 0) say(`● ${clock(t - recStart)}`, true);
    }
    relay.send({ t: MSG.POSE, ts: t, q: qa, p, rec: recording, st: setMs, fov: camera.fov, aspect: camera.aspect, ...(ghostOn && { gh: 1 }) });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// --- one-time hint after motion is on ----------------------------------------
function showHintOnce() {
  try { if (localStorage.getItem('handcam.camhint') === '1') return; localStorage.setItem('handcam.camhint', '1'); } catch {}
  const h = document.createElement('div');
  h.className = 'hint glass';
  h.innerHTML = '<b>Quick start</b><p>Point the phone at the set and tap <b>Re-anchor</b>. Left stick walks, right stick goes up and down, the slider zooms. Tap ● to record, ● again to stop.</p><button class="btn light">Got it</button>';
  h.querySelector('button').onclick = () => h.remove();
  document.body.append(h);
}

// --- permission gate -------------------------------------------------------
document.getElementById('enable').onclick = async () => {
  const err = document.getElementById('err');
  if (!isSecureContext) { err.textContent = 'This page must be opened over https:// for motion to work. See README → tunnel.'; return; }
  const ok = await requestMotionPermission();
  if (!ok) { err.textContent = 'Motion permission was denied. Close this tab, open the link again and tap Allow.'; return; }
  addEventListener('deviceorientation', onOrientation, true);
  document.getElementById('gate').hidden = true;
  document.getElementById('hud').hidden = false;
  showHintOnce();
};
</script>
</body>
