<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HandCam · phone</title>
<style>
  :root { color-scheme: dark; }
  [hidden] { display: none !important; } /* #gate/#hud set display below, which would otherwise beat the hidden attribute */
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 15px/1.3 -apple-system, system-ui, sans-serif; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #view { position: fixed; inset: 0; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom)); }
  #hud > * { pointer-events: auto; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .top .right { display: flex; gap: 8px; }
  .pill { background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.15); border-radius: 999px; padding: 6px 10px; backdrop-filter: blur(6px); }
  #status.rec { color: #ff6b6b; font-variant-numeric: tabular-nums; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  button { font: inherit; color: #fff; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 6px 12px; }
  #rec { width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff; background: #e33; padding: 0; flex: none; }
  #rec.on { border-radius: 16px; width: 60px; height: 60px; margin: 9px; }
  .stickwrap { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; opacity: .8; }
  .stick { position: relative; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.22); touch-action: none; }
  .stick.vertical { width: 64px; height: 120px; border-radius: 32px; }
  .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: rgba(255,255,255,.35); pointer-events: none; }
  #gate { position: fixed; inset: 0; background: #000; display: grid; place-items: center; text-align: center; padding: 24px; }
  #gate h1 { font-size: 22px; margin: 0 0 8px; }
  #gate p { opacity: .7; max-width: 32ch; margin: 0 0 20px; }
  #gate button { background: #fff; color: #000; font-weight: 600; padding: 14px 26px; }
  #err { color: #f88; font-size: 13px; margin-top: 12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" hidden>
  <div class="top">
    <span class="pill" id="status">connecting…</span>
    <div class="right">
      <button id="speed" aria-label="Walking speed">1×</button>
      <button id="anchor">Re‑anchor</button>
      <span class="pill" id="room"></span>
    </div>
  </div>
  <div class="bottom">
    <div class="stickwrap"><div class="stick" id="walk"></div>walk</div>
    <button id="rec" aria-label="Record"></button>
    <div class="stickwrap"><div class="stick vertical" id="lift"></div>up / down</div>
  </div>
</div>

<div id="gate">
  <div>
    <h1>Your phone is the camera</h1>
    <p>Tap below, then move the phone. Hold it like you'd film with it.</p>
    <button id="enable">Enable motion</button>
    <div id="err"></div>
  </div>
</div>

<script type="module">
import * as THREE from './shared/three.js';
import { MSG, connectRelay } from './shared/protocol.js';
import { orientationToQuaternion, requestMotionPermission, screenAngle } from './shared/orientation.js';
import { renderScene, povStage } from './shared/scene-render.js';
import { makeStick } from './shared/joystick.js';
import { putTake } from './shared/store.js';

const WALK_SPEED = 1.4;          // m/s at 1×, a normal walking pace
const SPEEDS = [1, 3, 10];       // life-size, then faster for big sets
const SAMPLE_MS = 1000 / 60 - 4; // every frame at 60 Hz, every other frame at 120 Hz

const params = new URLSearchParams(location.search);
const room = (params.get('room') || 'DEMO').toUpperCase();
document.getElementById('room').textContent = room;
const statusEl = document.getElementById('status');
const say = (text, rec = false) => { statusEl.textContent = text; statusEl.classList.toggle('rec', rec); };

// --- three.js POV --------------------------------------------------------
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene3 = povStage();
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 200);
let sceneGroup = null, sceneId = null, spawn = { p: [0, 1.6, 6], yaw: 0 };
camera.position.fromArray(spawn.p);
function setScene(scene) {
  if (sceneGroup) scene3.remove(sceneGroup);
  sceneGroup = renderScene(scene);
  scene3.add(sceneGroup);
  sceneId = scene.id || null;
  spawn = { p: scene.spawn?.p || [0, 1.6, 6], yaw: scene.spawn?.yaw || 0 };
  anchor();
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// --- orientation + re-anchor ------------------------------------------------
const rawQ = new THREE.Quaternion();
const yawOffset = new THREE.Quaternion(); // turns "where the phone points now" into the set's forward
const Y = new THREE.Vector3(0, 1, 0);
let haveOrientation = false;
function onOrientation(e) {
  if (e.alpha == null) return;
  orientationToQuaternion(rawQ, e.alpha, e.beta, e.gamma, screenAngle());
  if (!haveOrientation) { haveOrientation = true; anchor(); } // first reading: start facing the set
}
/** Re-anchor: wherever the phone points now becomes the spawn direction, and the camera goes back to spawn. */
function anchor() {
  camera.position.fromArray(spawn.p);
  if (!haveOrientation) return;
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(rawQ);
  const yaw = Math.atan2(-fwd.x, -fwd.z);
  yawOffset.setFromAxisAngle(Y, spawn.yaw - yaw);
}
document.getElementById('anchor').onclick = () => { anchor(); relay.send({ t: MSG.ANCHOR }); };

// --- walking ----------------------------------------------------------------
const walk = makeStick(document.getElementById('walk'));
const lift = makeStick(document.getElementById('lift'));
let speedScale = 1;
const speedBtn = document.getElementById('speed');
speedBtn.onclick = () => { speedScale = SPEEDS[(SPEEDS.indexOf(speedScale) + 1) % SPEEDS.length]; speedBtn.textContent = `${speedScale}×`; };
const heading = new THREE.Euler();
function move(dt) {
  const { x: wx, y: wy } = walk.value, ly = lift.value.y;
  if (!wx && !wy && !ly) return;
  const yaw = heading.setFromQuaternion(camera.quaternion, 'YXZ').y; // walk where the camera faces, ignoring tilt
  const step = WALK_SPEED * speedScale * dt;
  camera.position.x += (Math.cos(yaw) * wx + Math.sin(yaw) * wy) * step;
  camera.position.z += (-Math.sin(yaw) * wx + Math.cos(yaw) * wy) * step;
  camera.position.y = Math.max(0.1, camera.position.y - ly * step);
}

// --- relay -----------------------------------------------------------------
const relay = connectRelay({
  role: 'cam', room,
  onStatus: s => { if (!recording) say(s); },
  onMessage: (m) => {
    if (m.t === MSG.SCENE) setScene(m.scene);
    if (m.t === MSG.PEER && !recording) say(m.joined ? 'desk connected' : 'desk left');
    if (m.t === MSG.REC) setRec(m.state === 'start');
  },
});
// The set comes from the desk: it sends `scene` whenever it builds one and whenever this phone joins.

// --- recording -----------------------------------------------------------------
// Samples are the exact values driving this view: unfiltered rotation, joystick position. Never smoothed.
let recording = false, samples = [], recStart = null, takeCount = 0;
const recBtn = document.getElementById('rec');
function setRec(on) {
  if (on === recording) return;
  recording = on;
  recBtn.classList.toggle('on', on);
  if (on) { samples = []; recStart = null; say('● 0:00', true); }
  else finishTake();
}
recBtn.onclick = () => setRec(!recording);

function takeId() {
  const hex = Math.floor(Math.random() * 0x10000).toString(16).padStart(4, '0');
  return `${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}Z-${hex}`;
}
async function finishTake() {
  if (!samples.length) { say('nothing recorded'); return; }
  const take = {
    id: takeId(), sceneId, fps_hint: 60,
    view: { fov: camera.fov, aspect: camera.aspect },
    device: { ua: navigator.userAgent, source: 'gyro+joystick' },
    samples,
  };
  samples = [];
  relay.send({ t: MSG.TAKE, take }); // the whole take in one message, after the fact: no live packet loss can touch it
  takeCount++;
  say(`take ${takeCount} · ${(take.samples.at(-1).ts / 1000).toFixed(1)} s · ${take.samples.length} samples`);
  try { await putTake(take); } catch (e) { console.warn('could not keep take on phone', e); }
}
const clock = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}`;

// --- main loop -------------------------------------------------------------
const q = new THREE.Quaternion();
let lastFrame = null, lastSample = -Infinity;
function frame(t) {
  const dt = lastFrame === null ? 0 : Math.min((t - lastFrame) / 1000, 0.1);
  lastFrame = t;
  if (haveOrientation) {
    q.copy(yawOffset).multiply(rawQ);
    camera.quaternion.copy(q);
    move(dt);
  }
  renderer.render(scene3, camera);
  if (haveOrientation && t - lastSample >= SAMPLE_MS) {
    lastSample = t;
    const qa = [q.x, q.y, q.z, q.w], p = camera.position.toArray();
    if (recording) {
      if (recStart === null) recStart = t;
      samples.push({ ts: t - recStart, q: qa, p });
      if (samples.length % 30 === 0) say(`● ${clock(t - recStart)}`, true);
    }
    relay.send({ t: MSG.POSE, ts: t, q: qa, p, rec: recording, fov: camera.fov, aspect: camera.aspect });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// --- permission gate -------------------------------------------------------
document.getElementById('enable').onclick = async () => {
  const err = document.getElementById('err');
  if (!isSecureContext) { err.textContent = 'This page must be opened over https:// for motion to work. See README → tunnel.'; return; }
  const ok = await requestMotionPermission();
  if (!ok) { err.textContent = 'Motion permission was denied. Close this tab, open the link again and tap Allow.'; return; }
  addEventListener('deviceorientation', onOrientation, true);
  document.getElementById('gate').hidden = true;
  document.getElementById('hud').hidden = false;
};
</script>
</body>
</html>
