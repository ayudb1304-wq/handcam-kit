<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HandCam · phone</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 15px/1.3 -apple-system, system-ui, sans-serif; overflow: hidden; touch-action: none; }
  #view { position: fixed; inset: 0; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom)); }
  #hud > * { pointer-events: auto; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; opacity: .85; }
  .pill { background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.15); border-radius: 999px; padding: 6px 10px; backdrop-filter: blur(6px); }
  .bottom { display: flex; justify-content: center; align-items: center; gap: 28px; }
  button { font: inherit; color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 12px 18px; }
  #rec { width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff; background: #e33; padding: 0; }
  #rec.on { border-radius: 16px; width: 60px; height: 60px; margin: 9px; }
  #gate { position: fixed; inset: 0; background: #000; display: grid; place-items: center; text-align: center; padding: 24px; }
  #gate h1 { font-size: 22px; margin: 0 0 8px; }
  #gate p { opacity: .7; max-width: 32ch; margin: 0 0 20px; }
  #gate button { background: #fff; color: #000; font-weight: 600; padding: 14px 26px; }
  #err { color: #f88; font-size: 13px; margin-top: 12px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" hidden>
  <div class="top">
    <span class="pill" id="status">connecting…</span>
    <span class="pill" id="room"></span>
  </div>
  <div class="bottom">
    <button id="anchor">Re‑anchor</button>
    <button id="rec" aria-label="Record"></button>
    <span style="width:98px"></span>
  </div>
</div>

<div id="gate">
  <div>
    <h1>Your phone is the camera</h1>
    <p>Tap below, then move the phone. Hold it like you'd film with it.</p>
    <button id="enable">Enable motion</button>
    <div id="err"></div>
  </div>
</div>

<script type="module">
import * as THREE from './shared/three.js';
import { MSG, connectRelay } from './shared/protocol.js';
import { orientationToQuaternion, requestMotionPermission, screenAngle } from './shared/orientation.js';
import { renderScene, addDefaultLights } from './shared/scene-render.js';

const params = new URLSearchParams(location.search);
const room = (params.get('room') || 'DEMO').toUpperCase();
document.getElementById('room').textContent = room;

// --- three.js POV --------------------------------------------------------
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene3 = new THREE.Scene();
scene3.background = new THREE.Color(0x0b0d12);
scene3.fog = new THREE.Fog(0x0b0d12, 25, 60);
addDefaultLights(scene3);
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 200);
camera.position.set(0, 1.6, 6);
let sceneGroup = null;
function setScene(scene) {
  if (sceneGroup) scene3.remove(sceneGroup);
  sceneGroup = renderScene(scene);
  scene3.add(sceneGroup);
  const [x, y, z] = scene.spawn?.p || [0, 1.6, 6];
  camera.position.set(x, y, z);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// --- orientation -----------------------------------------------------------
const rawQ = new THREE.Quaternion();
const yawOffset = new THREE.Quaternion(); // re-anchor: makes "current heading" = forward
let haveOrientation = false;
function onOrientation(e) {
  if (e.alpha == null) return;
  orientationToQuaternion(rawQ, e.alpha, e.beta, e.gamma, screenAngle());
  haveOrientation = true;
}
document.getElementById('anchor').onclick = () => {
  // Extract yaw of current raw orientation and store its inverse so forward becomes -Z.
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(rawQ); fwd.y = 0; fwd.normalize();
  const yaw = Math.atan2(-fwd.x, -fwd.z);
  yawOffset.setFromAxisAngle(new THREE.Vector3(0, 1, 0), -yaw);
  relay.send({ t: MSG.ANCHOR });
};

// --- relay -----------------------------------------------------------------
const statusEl = document.getElementById('status');
const relay = connectRelay({
  role: 'cam', room,
  onStatus: s => statusEl.textContent = s,
  onMessage: (m) => {
    if (m.t === MSG.SCENE) setScene(m.scene);
    if (m.t === MSG.PEER) statusEl.textContent = m.joined ? 'desk connected' : 'desk left';
    if (m.t === MSG.REC) setRec(m.state === 'start');
  },
});

// Ask the desk for a scene if we arrived late: Phase 0 just loads the template directly.
fetch('/api/scene', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt: 'parking lot' }) })
  .then(r => r.json()).then(({ scene }) => { if (!sceneGroup) setScene(scene); });

// --- recording (Phase 2 fills in buffering, IndexedDB, take upload) --------
let recording = false, recStart = 0;
const recBtn = document.getElementById('rec');
function setRec(on) {
  recording = on; recBtn.classList.toggle('on', on);
  if (on) recStart = performance.now();
  // TODO Phase 2: on stop, assemble take and send MSG.TAKE
}
recBtn.onclick = () => setRec(!recording);

// --- main loop -------------------------------------------------------------
const q = new THREE.Quaternion();
let lastSend = 0;
function frame(t) {
  if (haveOrientation) {
    q.copy(yawOffset).multiply(rawQ);
    camera.quaternion.copy(q);
  }
  renderer.render(scene3, camera);
  if (haveOrientation && t - lastSend >= 1000 / 60) {
    lastSend = t;
    relay.send({ t: MSG.POSE, ts: recording ? t - recStart : t, q: [q.x, q.y, q.z, q.w], p: camera.position.toArray(), rec: recording });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// --- permission gate -------------------------------------------------------
document.getElementById('enable').onclick = async () => {
  const err = document.getElementById('err');
  if (!isSecureContext) { err.textContent = 'This page must be opened over https:// for motion to work. See README → tunnel.'; return; }
  const ok = await requestMotionPermission();
  if (!ok) { err.textContent = 'Motion permission was denied. Reload the page and tap Allow.'; return; }
  addEventListener('deviceorientation', onOrientation, true);
  document.getElementById('gate').hidden = true;
  document.getElementById('hud').hidden = false;
};
</script>
</body>
</html>
