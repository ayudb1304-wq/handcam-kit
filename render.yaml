# Render Blueprint: one always-on web service + a small disk for accounts and videos. Its https address comes from
# Render itself (RENDER_EXTERNAL_URL); PUBLIC_URL (cinehand.com) overrides it and old onrender.com pages redirect there.
# Workspace plan "Hobby" ($0) + instance "starter" (~$7/mo) + 1 GB disk. See README → Hosting.
services:
  - type: web
    name: handcam
    runtime: docker
    plan: starter
    healthCheckPath: /api/info
    disk:
      name: handcam-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS        # your account email: sees real AI costs and can use real AI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: PUBLIC_URL          # the custom domain: links, checkout returns and the phone QR use it
        value: https://cinehand.com
      - key: DODO_MODE           # live: real payments (live key + live webhook secret in Render's Environment)
        value: live
      - key: DODO_WEBHOOK_SECRET
        sync: false
      - key: HF_API_KEY_ID
        sync: false
      - key: HF_API_KEY_SECRET
        sync: false
      - key: SUPABASE_URL        # sign-in (Google, email) and the accounts database: public value
        value: https://tjzwtucxjnhdyvkifnso.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY   # public by design (sent to browsers)
        value: sb_publishable_jVtfzkBQ1PeoCfSPn__Zyg_O0ytPc77
      - key: SUPABASE_SECRET_KEY # sb_secret_…: Supabase → Project Settings → API Keys. Server only, never in the repo
        sync: false
      - key: REAL_AI             # "on" lets customers make real AI videos (spends your Higgsfield API money, ~$1 per 480p version)
        value: "on"
